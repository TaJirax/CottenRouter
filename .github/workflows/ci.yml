name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - name: Multi-protocol compatibility and performance gate
        run: go test -run 'Test(AllDNSBackendsShareOneFrontendUnderLoad|UDPMaximumPacketRemainsByteTransparent|EncryptedProtocolsRemainIsolatedConcurrently)$' -count=3 ./internal/router
      - name: Routing overhead (numbers recorded in the log, unraced)
        run: go test -v -count=1 -run 'TestRouterUDP(ThroughputAgainstDirectBaseline|RawLoopbackOverheadDiagnostic)$' ./internal/router
      - run: go test -race ./...
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - run: go build ./cmd/cottenrouter
      - run: bash -n scripts/*.sh
