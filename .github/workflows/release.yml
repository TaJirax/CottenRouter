name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: bash -n scripts/*.sh
      - name: Build release binaries
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          # Export the pair, rather than prefixing go build: a command prefix is
          # not visible to the shell expanding the -o path, which silently wrote
          # every target to the same file.
          for target in linux/amd64 linux/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            output="dist/cottenrouter-${GOOS}-${GOARCH}"
            go build -trimpath \
              -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "$output" ./cmd/cottenrouter
            test -s "$output"
          done
          ls -1 dist
          cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
